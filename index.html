<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediClarify - Medical Report Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Noto+Sans+Bengali:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- html2pdf for report generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
      body {
        font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      
      @media print {
        .no-print { display: none !important; }
        body { background-color: white !important; }
        #report-content { 
          width: 100% !important; 
          margin: 0 !important; 
          padding: 10px !important;
          background: white !important;
        }
        .prose h3 { color: #1e3a8a !important; }
        .prose p { color: #1e293b !important; }
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
      .animate-shake { animation: shake 0.3s ease-in-out; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",

    "vite": "https://esm.sh/vite@^7.3.1",

    "@vercel/node": "https://esm.sh/@vercel/node@^5.5.28",
    "@netlify/functions": "https://esm.sh/@netlify/functions@^5.1.2"
  }
}
</script>
</head>
  <body class="bg-slate-50 text-slate-900">

  </body>
</html>
